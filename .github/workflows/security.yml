name: Security Scan

on:
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches: [main]

jobs:

  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: |
          cd frontend
          npm ci
          npm audit --audit-level=high
